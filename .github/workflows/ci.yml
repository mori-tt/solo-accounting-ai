name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      # tsconfig が .next/types を include するため、生成型を先に作る
      - name: Generate Next.js route types
        run: pnpm exec next typegen
      - name: Run tsc
        run: pnpm typecheck

  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run Vitest
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run next build
        run: pnpm build

  test-rules:
    name: test:rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      # firebase-tools 15系は JDK 21+ が必須
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Emulator JAR(~/.cache/firebase/emulators)は初回起動時に
      # ダウンロードされるためキャッシュしてCI時間を短縮する。
      # lockfile(firebase-toolsのバージョン)変化で無効化される
      - name: Cache Firebase Emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      # devDependency の firebase-tools で Emulator を起動して Security Rules を検証
      - name: Run Security Rules tests on Firebase Emulator
        run: pnpm test:rules

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      # firebase-tools 15系は JDK 21+ が必須
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Emulator JAR(~/.cache/firebase/emulators)は初回起動時に
      # ダウンロードされるためキャッシュしてCI時間を短縮する。
      # lockfile(firebase-toolsのバージョン)変化で無効化される
      - name: Cache Firebase Emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      # ブラウザ本体(~/.cache/ms-playwright)も同様にキャッシュ。
      # @playwright/test のバージョン=lockfile由来のため同一キーでよい
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Emulator(auth/firestore/storage) + next dev(webServer自動起動)でE2Eを実行。
      # Emulator接続設定はコミット済みの .env.development が使われる
      - name: Run E2E tests on Firebase Emulator
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
