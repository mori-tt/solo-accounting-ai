name: Setup Node.js and pnpm
description: >-
  Node.js(.node-version) + pnpm(package.json の packageManager バージョン)をセットアップし、
  pnpm store をキャッシュして依存関係をインストールする。

runs:
  using: composite
  steps:
    # version 未指定: package.json の packageManager フィールド(pnpm@12.16.1)から解決される
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # vitest@5(>=22.12)・firebase-admin@14(>=22)が Node 20 非対応のため .node-version で単一ソース化
        node-version-file: .node-version
        # pnpm store ディレクトリをキャッシュ(pnpm-lock.yaml をキーに使用)
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
